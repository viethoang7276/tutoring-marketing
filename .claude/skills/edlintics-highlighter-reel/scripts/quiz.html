<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap">
<style>
/* Quiz-sheet reel (1080x1920): a printed Edlintics quiz on the desk; a drawn hand with a blue pen underlines each question,
   a 5-second countdown runs in the icon slot, then the pen ticks the answer. The sheet scrolls up question by question.
   Inter only. Timeline from quiz_build.py (timeline.json). */
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;background:#c8904f;overflow:hidden}
#stage{position:absolute;left:0;top:0}
</style></head><body>
<svg id="stage" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="woodbase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DDAE72"/><stop offset=".55" stop-color="#D19B5C"/><stop offset="1" stop-color="#C38849"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.0022 0.085" numOctaves="4" seed="11" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.42  0 0 0 0 0.24  0 0 0 0 0.09  1.6 0 0 0 -0.62" result="streaks"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4" result="f"/>
      <feColorMatrix in="f" type="matrix" values="0 0 0 0 0.3  0 0 0 0 0.18  0 0 0 0 0.06  0 0 0 0.35 -0.08" result="fine"/>
      <feMerge><feMergeNode in="streaks"/><feMergeNode in="fine"/></feMerge>
    </filter>
    <radialGradient id="vig" cx=".5" cy=".42" r=".75"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#2a1606" stop-opacity=".28"/></radialGradient>
    <filter id="papershadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#3b2208" flood-opacity=".35"/></filter>
    <filter id="handshadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow id="hsd" dx="12" dy="16" stdDeviation="7" flood-color="#2a1606" flood-opacity=".28"/></filter>
    <filter id="cdshadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0F172A" flood-opacity=".18"/></filter>
  </defs>
  <rect width="1080" height="1920" fill="url(#woodbase)"/>
  <rect width="1080" height="1920" filter="url(#grain)"/>
  <rect width="1080" height="1920" fill="url(#vig)"/>
  <g id="sheetg">
    <rect id="paper" width="960" height="3000" fill="#fff" filter="url(#papershadow)"/>
    <g id="sheet"></g>
    <g id="ink"></g>
  </g>
  <!-- Drawn hand with a blue pen. Local coords: nib at 0,0, pen along +x; flat line art, ink #0F172A 5 px, white fill, blue cuff -->
  <g id="hand" filter="url(#handshadow)" stroke="#0F172A" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <rect x="244" y="-82" width="1300" height="96" fill="#DCE6F7"/>
    <rect x="208" y="-88" width="40" height="108" rx="6" fill="#467DE3"/>
    <rect x="98" y="-96" width="122" height="124" rx="46" fill="#FFFFFF"/>
    <path d="M150 -88 q10 8 0 18 M176 -84 q10 8 0 18" fill="none" stroke-width="4"/>
    <path d="M0 0 L22 -9 L22 9 Z" fill="#0F172A" stroke-width="3"/>
    <rect x="20" y="-14" width="26" height="28" rx="4" fill="#E5E9F0"/>
    <rect x="44" y="-16" width="250" height="32" rx="10" fill="#467DE3"/>
    <line x1="66" y1="-6" x2="276" y2="-6" stroke="#9DBBF2" stroke-width="5"/>
    <rect x="292" y="-15" width="22" height="30" rx="8" fill="#0F172A"/>
    <rect x="58" y="8" width="84" height="32" rx="16" fill="#FFFFFF" transform="rotate(8 58 8)"/>
    <rect x="50" y="-48" width="92" height="32" rx="16" fill="#FFFFFF"/>
  </g>
</svg>
<script>
const NS = 'http://www.w3.org/2000/svg';
const $ = s => document.querySelector(s);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ramp = (t, a, b) => clamp((t - a) / (b - a));
const ease = x => x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
const back = x => { const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const BLUE = '#467DE3', INK = '#0F172A', SLATE = '#334155';
const SX = 60, SY0 = 110;           // sheet left edge and its top on screen before any scroll
const FOCUS = 400;                  // the current question's top sits this far down the screen
let T, sheet, ink, hand, hsd, strokes = [], blocks = [], scrolls = [], endEls = {};

function el(tag, at, parent, text) {
  const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]);
  if (text != null) e.textContent = text; (parent || sheet).appendChild(e); return e;
}
function txt(x, y, s, fs, wt, fill, anchor) {
  return el('text', { x, y, 'font-family': 'Inter', 'font-size': fs, 'font-weight': wt, fill, 'text-anchor': anchor || 'start' }, sheet, s);
}
function wrap(s, fs, wt, width) {    // greedy wrap measured in the page
  const probe = txt(0, -999, '', fs, wt, INK); const out = []; let cur = '';
  for (const w of s.split(' ')) { probe.textContent = cur ? cur + ' ' + w : w;
    if (probe.getComputedTextLength() > width && cur) { out.push(cur); cur = w; } else cur = probe.textContent; }
  out.push(cur); probe.remove(); return out;
}
function wavy(x0, x1, y) {   // hand-drawn wavy underline
  let d = `M${x0} ${y}`; const n = Math.max(2, Math.round((x1 - x0) / 26));
  for (let k = 1; k <= n; k++) { const x = x0 + (x1 - x0) * k / n; d += ` Q${(x - (x1 - x0) / n / 2).toFixed(1)} ${y + (k % 2 ? -5 : 5)} ${x.toFixed(1)} ${y + (k % 2 ? 1 : -1)}`; }
  return d;
}
function stroke(d, t0, t1, w) {
  const p = el('path', { d, fill: 'none', stroke: BLUE, 'stroke-width': w || 5, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', opacity: .92 }, ink);
  const len = p.getTotalLength(); p.style.strokeDasharray = `${len + 2}`; p.style.strokeDashoffset = `${len + 2}`;
  strokes.push({ p, len, t0, t1 }); return p;
}

// ---- flat icons, about 120 px, centred on (cx, cy)
const ICONS = {
  receipt: `<path d="M-38 -56 H38 V50 l-9.5 -8 -9.5 8 -9.5 -8 -9.5 8 -9.5 -8 -9.5 8 -9.5 -8 -9.5 8 Z" fill="#fff"/><rect x="-38" y="-56" width="76" height="20" fill="${BLUE}"/>
    <path d="M-24 -20 H24 M-24 -4 H14 M-24 12 H24" stroke-width="5"/><path d="M8 30 H24" stroke-width="6"/>`,
  certificate: `<rect x="-44" y="-38" width="88" height="70" rx="4" fill="#FDF3DC"/><rect x="-52" y="-46" width="14" height="86" rx="7" fill="#F2DDA8"/><rect x="38" y="-46" width="14" height="86" rx="7" fill="#F2DDA8"/>
    <path d="M-26 -18 H26 M-26 -4 H18 M-26 10 H8" stroke-width="4"/><circle cx="22" cy="26" r="13" fill="${BLUE}"/><path d="M16 38 l-4 16 10 -6 10 6 -4 -16" fill="${BLUE}" stroke-width="4"/>`,
  card: `<rect x="-58" y="-38" width="116" height="76" rx="10" fill="${BLUE}"/><rect x="-58" y="-24" width="116" height="16" fill="${INK}" stroke="none"/>
    <rect x="-44" y="6" width="56" height="16" rx="4" fill="#fff" stroke-width="4"/><path d="M-38 15 q6 -8 10 0 t10 0 t10 0" fill="none" stroke-width="3"/>`,
  payslip: `<rect x="-42" y="-56" width="84" height="108" rx="6" fill="#fff"/><text x="0" y="-30" font-family="Inter" font-size="17" font-weight="900" fill="${INK}" stroke="none" text-anchor="middle">PAYSLIP</text>
    <text x="-30" y="-2" font-family="Inter" font-size="15" font-weight="700" fill="${SLATE}" stroke="none">Gross</text><path d="M14 -7 H30" stroke-width="5"/>
    <text x="-30" y="20" font-family="Inter" font-size="15" font-weight="700" fill="#DC2626" stroke="none">Tax</text><path d="M14 15 H30" stroke="#DC2626" stroke-width="5"/>
    <path d="M-30 30 H30" stroke-width="3"/><text x="-30" y="46" font-family="Inter" font-size="15" font-weight="900" fill="#16A34A" stroke="none">Net</text><path d="M14 41 H30" stroke="#16A34A" stroke-width="5"/>`,
  chart: `<rect x="-52" y="-52" width="104" height="104" rx="8" fill="#fff"/><rect x="-36" y="0" width="18" height="36" fill="#22C55E"/><rect x="-9" y="14" width="18" height="22" fill="#EF4444"/><rect x="18" y="-34" width="18" height="70" fill="${BLUE}"/><path d="M-42 38 H42" stroke-width="4"/>`,
  scale: `<path d="M0 -50 V40 M-26 44 H26" stroke-width="7"/><path d="M-48 -34 H48" stroke-width="6"/><circle cx="0" cy="-50" r="6" fill="${BLUE}"/>
    <path d="M-48 -34 l-18 34 h36 Z M48 -34 l-18 34 h36 Z" fill="#DCE6F7" stroke-width="4"/><path d="M-70 0 a22 10 0 0 0 44 0 Z M26 0 a22 10 0 0 0 44 0 Z" fill="${BLUE}" stroke-width="4"/>`,
  book: `<path d="M0 -30 C-20 -44 -46 -44 -62 -36 V38 C-46 30 -20 30 0 44 Z" fill="#fff"/><path d="M0 -30 C20 -44 46 -44 62 -36 V38 C46 30 20 30 0 44 Z" fill="#fff"/>
    <path d="M0 -30 V44" stroke-width="4"/><path d="M-48 -18 C-34 -22 -20 -22 -12 -16 M-48 -2 C-34 -6 -20 -6 -12 0 M48 -18 C34 -22 20 -22 12 -16 M48 -2 C34 -6 20 -6 12 0" fill="none" stroke-width="3"/>
    <path d="M-62 38 C-46 30 -20 30 0 44 C20 30 46 30 62 38 V48 H-62 Z" fill="${BLUE}" stroke-width="4"/>`
};

function setup() {
  T = window.__T; sheet = $('#sheet'); ink = $('#ink'); hand = $('#hand'); hsd = $('#hsd');
  // header: logo, title, subtitle
  el('image', { href: 'edlintics-logo.png', x: 355, y: 44, width: 250, height: 65 });
  const title = txt(480, 214, T.title, 84, 900, INK, 'middle');
  txt(480, 272, T.subtitle, 36, 600, SLATE, 'middle');
  const tw = title.getComputedTextLength();
  const tul = wavy(480 - tw / 2 * 0.42, 480 + tw / 2, 236);
  stroke(tul, T.intro.ul_t0, T.intro.ul_t1, 6);
  let y = 380;
  T.questions.forEach((q, i) => {
    const top = y - 50, B = { q, top };
    const ql = wrap(`${i + 1}) ${q.q}`, 46, 800, 870);
    B.qlines = ql.map((s, k) => { const e = txt(40, y + k * 60, s, 46, 800, INK); return { e, y: y + k * 60, w: e.getComputedTextLength() }; });
    y += (ql.length - 1) * 60 + 34;
    // options: shrink a long option so it ends before the icon slot
    B.opts = q.options.map((o, k) => {
      const oy = y + 30 + k * 66;
      el('rect', { x: 70, y: oy - 31, width: 36, height: 36, rx: 4, fill: '#fff', stroke: INK, 'stroke-width': 3.5 });
      let fs = 40; const e = txt(128, oy, o, fs, 600, '#1E293B');
      while (e.getComputedTextLength() > 590 && fs > 28) { fs -= 1; e.setAttribute('font-size', fs); }
      return { e, y: oy };
    });
    const cy = y + 30 + 66 - 12;
    B.slot = { x: 835, y: cy };
    B.icon = el('g', { transform: `translate(835 ${cy})`, stroke: INK, 'stroke-width': 5, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' });
    B.icon.innerHTML = ICONS[q.icon] || '';
    // countdown: white disc, blue ring that runs out, the seconds left
    B.cd = el('g', { transform: `translate(835 ${cy})`, opacity: 0, filter: 'url(#cdshadow)' });
    el('circle', { r: 58, fill: '#fff', stroke: '#E2E8F0', 'stroke-width': 10 }, B.cd);
    B.ring = el('circle', { r: 58, fill: 'none', stroke: BLUE, 'stroke-width': 10, 'stroke-linecap': 'round', transform: 'rotate(-90)' }, B.cd);
    B.ringLen = 2 * Math.PI * 58; B.ring.style.strokeDasharray = B.ringLen;
    B.num = el('text', { y: 22, 'font-family': 'Inter', 'font-size': 66, 'font-weight': 900, fill: BLUE, 'text-anchor': 'middle' }, B.cd, '5');
    // strokes: one wavy underline per question line, split over the reading time by width; then the tick
    const total = B.qlines.reduce((a, l) => a + l.w, 0); let t = q.ul_t0;
    B.qlines.forEach(l => { const dt = (q.ul_t1 - q.ul_t0) * l.w / total; stroke(wavy(40, 40 + l.w, l.y + 14), t, t + dt); t += dt; });
    const by = B.opts[q.correct].y - 31;
    stroke(`M76 ${by + 18} L88 ${by + 32} L116 ${by - 10}`, q.tick_t0, q.tick_t1, 7);
    B.correct = B.opts[q.correct].e;
    y += 30 + 3 * 66 + 60;
    blocks.push(B);
  });
  // end block
  const ey = y + 40;
  endEls.l1 = txt(480, ey, T.end_lines[0], 64, 900, INK, 'middle');
  endEls.l2 = txt(480, ey + 74, T.end_lines[1], 46, 800, BLUE, 'middle');
  endEls.led = el('g', {}); endEls.led.innerHTML = `<g transform="translate(480 ${ey + 360}) scale(1.05)">${T.ledger}</g>`;
  endEls.ledY = ey + 360;
  const H = ey + 420; $('#paper').setAttribute('height', H);
  // scroll keys: [time, scroll]
  scrolls = [[0, 0]];
  blocks.forEach((B, i) => { if (i) scrolls.push([B.q.scroll_t, Math.max(0, B.top + SY0 - FOCUS)]); });
  scrolls.push([T.end_scroll_t, Math.max(0, ey - 120 + SY0 - 560)]);
  return T.dur;
}

function scrollAt(t) {
  let s = 0;
  for (let k = 0; k < scrolls.length; k++) {
    const [ts, v] = scrolls[k]; const prev = k ? scrolls[k - 1][1] : 0;
    if (t >= ts) s = prev + (v - prev) * ease(ramp(t, ts, ts + 0.85));
  }
  return s;
}

const REST = [1130, 1980];
function nibOf(st, f) {    // a point of a stroke, on screen
  const p = st.p.getPointAtLength(st.len * clamp(f)); const m = st.p.getScreenCTM();
  const q = new DOMPoint(p.x, p.y).matrixTransform(m); return [q.x, q.y];
}
function handPos(t) {
  for (const st of strokes) if (t >= st.t0 && t <= st.t1) return [...nibOf(st, ease(ramp(t, st.t0, st.t1)) * 0.15 + ramp(t, st.t0, st.t1) * 0.85), 0];
  let prev = null, next = null;
  for (const st of strokes) { if (st.t1 < t) prev = st; else if (st.t0 > t && !next) next = st; }
  const pe = prev ? nibOf(prev, 1) : REST, ns = next ? nibOf(next, 0) : REST;
  const tpe = prev ? prev.t1 : -9, tns = next ? next.t0 : 1e9;
  const mix = (a, b, f) => [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f];
  if (tns - tpe < 1.6) { const f = ease(ramp(t, tns - 0.45, tns)); const lift = Math.sin(Math.PI * f) + (f < 1 ? 0.3 : 0); return [...mix(pe, ns, f), clamp(lift)]; }
  if (t < tns - 0.6) { const f = ease(ramp(t, tpe + 0.15, tpe + 0.7)); return [...mix(pe, REST, f), clamp(f * 2)]; }
  const f = ease(ramp(t, tns - 0.6, tns)); return [...mix(REST, ns, f), clamp((1 - f) * 2)];
}

function render(t) {
  const sc = scrollAt(t);
  $('#sheetg').setAttribute('transform', `translate(${SX} ${SY0 - sc}) rotate(-0.5 480 600)`);
  for (const st of strokes) st.p.style.strokeDashoffset = (st.len + 2) * (1 - ramp(t, st.t0, st.t1) * 0.15 - ease(ramp(t, st.t0, st.t1)) * 0.85);
  blocks.forEach(B => {
    const q = B.q, on = ramp(t, q.cd_t0 - 0.2, q.cd_t0) * (1 - ramp(t, q.cd_t1, q.cd_t1 + 0.25));
    B.cd.setAttribute('opacity', on.toFixed(3)); B.icon.setAttribute('opacity', (1 - on).toFixed(3));
    const left = clamp(q.cd_t1 - t, 0, q.cd_t1 - q.cd_t0), n = Math.max(1, Math.ceil(left - 1e-6));
    B.num.textContent = String(n);
    const ph = (q.cd_t1 - t) % 1, pulse = t > q.cd_t0 && t < q.cd_t1 ? 1 + 0.12 * Math.max(0, (ph - 0.82) / 0.18) : 1;
    B.num.setAttribute('transform', `scale(${pulse.toFixed(3)})`);
    B.ring.style.strokeDashoffset = B.ringLen * (1 - left / (q.cd_t1 - q.cd_t0));
    const done = t >= q.tick_t1; B.correct.setAttribute('font-weight', done ? 800 : 600); B.correct.setAttribute('fill', done ? BLUE : '#1E293B');
  });
  const a1 = ease(ramp(t, T.end_t, T.end_t + 0.4)), a2 = ease(ramp(t, T.end2_t, T.end2_t + 0.4)), a3 = back(ramp(t, T.end2_t + 0.2, T.end2_t + 0.75));
  endEls.l1.setAttribute('opacity', a1); endEls.l1.setAttribute('transform', `translate(0 ${(1 - a1) * 24})`);
  endEls.l2.setAttribute('opacity', a2); endEls.l2.setAttribute('transform', `translate(0 ${(1 - a2) * 24})`);
  endEls.led.setAttribute('opacity', clamp(a3 * 3)); endEls.led.setAttribute('transform', `translate(480 ${endEls.ledY}) scale(${Math.max(0.01, a3)}) translate(-480 ${-endEls.ledY})`);
  const [x, y, lift] = handPos(t);
  const ang = 33 + clamp((560 - x) / 600, -0.6, 0.8) * 9, s = 1 + 0.035 * lift;
  hand.setAttribute('transform', `translate(${(x - 10 * lift).toFixed(1)} ${(y - 12 * lift).toFixed(1)}) rotate(${ang.toFixed(2)}) scale(${s})`);
  hsd.setAttribute('dx', 12 + 14 * lift); hsd.setAttribute('dy', 16 + 18 * lift); hsd.setAttribute('stdDeviation', 7 + 5 * lift);
  document.body.offsetHeight;
}

window.init = async () => { await document.fonts.ready; window.__T = await (await fetch('/timeline.json')).json(); await document.fonts.load('900 84px Inter'); return setup(); };
window.render = render;
</script></body></html>
