<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap">
<style>
/* "Where your money goes" reel (1080x1920), a sibling of the highlighter reel (render.html): same desk, printed sheet,
   captions and end card. The sheet holds one horizontal price bar that fills slice by slice, a legend row per slice with
   a simple icon, a turn highlight on the main slice, a value-chain arrow and a takeaway that shrinks one slice.
   Safe areas: sheet y 96-1400, captions y 1425-1565 on the desk, bottom ~355 px left for the app overlay. Inter only. */
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;background:#c8904f;overflow:hidden}
#stage{position:absolute;left:0;top:0}
#cap{position:absolute;left:30px;right:30px;top:1425px;height:140px;display:flex;align-items:center;justify-content:center}
#cap .c{white-space:nowrap;font:900 98px/1 Inter,sans-serif;color:#FFFFFF;-webkit-text-stroke:16px #0F172A;paint-order:stroke fill;letter-spacing:-0.01em;transform-origin:50% 60%}
#cap .k{color:#FFD45C}
#end{position:absolute;inset:0;background:#FFFFFF;opacity:0}
#end img{position:absolute;left:330px;top:190px;width:420px}
#end .term{position:absolute;left:40px;right:40px;top:350px;text-align:center;font:900 132px/1.05 Inter,sans-serif;color:#0F172A;letter-spacing:-0.02em}
#end .rule{position:absolute;left:470px;top:525px;width:140px;height:10px;background:#467DE3;border-radius:5px}
#end .kp{position:absolute;left:70px;right:70px;top:575px;text-align:center;font:800 64px/1.18 Inter,sans-serif;color:#0F172A;text-wrap:balance}
#end .kp span{-webkit-box-decoration-break:clone;box-decoration-break:clone}
#end .kp span{background-image:linear-gradient(transparent 52%,#FFD45C 52%,#FFD45C 92%,transparent 92%);background-repeat:no-repeat;background-size:var(--w,0%) 100%;padding:0 6px}
#end .fw{position:absolute;left:90px;right:90px;top:800px;text-align:center;font:800 50px/1.2 Inter,sans-serif;color:#334155;text-wrap:balance}
#end svg{position:absolute;left:0;top:0}
</style></head><body>
<svg id="stage" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="woodbase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DDAE72"/><stop offset=".55" stop-color="#D19B5C"/><stop offset="1" stop-color="#C38849"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.0022 0.085" numOctaves="4" seed="11" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.42  0 0 0 0 0.24  0 0 0 0 0.09  1.6 0 0 0 -0.62" result="streaks"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4" result="f"/>
      <feColorMatrix in="f" type="matrix" values="0 0 0 0 0.3  0 0 0 0 0.18  0 0 0 0 0.06  0 0 0 0.35 -0.08" result="fine"/>
      <feMerge><feMergeNode in="streaks"/><feMergeNode in="fine"/></feMerge>
    </filter>
    <radialGradient id="vig" cx=".5" cy=".42" r=".75"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#2a1606" stop-opacity=".28"/></radialGradient>
    <filter id="papershadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#3b2208" flood-opacity=".35"/></filter>
    <filter id="papergrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="2" seed="9"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.45  0 0 0 0 0.5  0 0 0 0.10 0"/>
    </filter>
    <filter id="glow" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="6"/></filter>
    <clipPath id="barclip"><rect id="barclipr" rx="18"/></clipPath>
  </defs>
  <rect width="1080" height="1920" fill="url(#woodbase)"/>
  <rect width="1080" height="1920" filter="url(#grain)"/>
  <rect width="1080" height="1920" fill="url(#vig)"/>
  <g id="sheetg" transform="translate(60 96) rotate(-0.7 480 650)">
    <rect width="960" height="1300" fill="#fff" filter="url(#papershadow)"/>
    <g id="hl" style="mix-blend-mode:multiply"></g>
    <g id="sheet"></g>
    <rect width="960" height="1300" filter="url(#papergrain)" style="mix-blend-mode:multiply" pointer-events="none"/>
  </g>
</svg>
<div id="cap"><div class="c"></div></div>
<div id="end"><img src="edlintics-logo.png"><div class="term"></div><div class="rule"></div><div class="kp"><span></span></div><div class="fw"></div>
  <svg width="1080" height="1920" viewBox="0 0 1080 1920"><g id="endchain"></g></svg></div>
<script>
let T, A = [], capC, G = {};
const $ = s => document.querySelector(s);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ramp = (t, a, b) => clamp((t - a) / (b - a));
const ease = x => x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
const back = x => 1 + 2.2 * Math.pow(x - 1, 3) + 1.2 * Math.pow(x - 1, 2);
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
const NS = 'http://www.w3.org/2000/svg';
const INK = '#0F172A', BLUE = '#467DE3', MUTED = '#64748B', HL = '#FFD84A';
const money = v => '$' + v.toFixed(2);
// layout in sheet coordinates (960 x 1300)
const BX = 60, BW = 840, BY = 520, BH = 120, ROW0 = 815, ROWH = 112, ICX = 112;

// simple line icons, drawn white on the slice colour, centred on 0,0 (about 56 px across)
const ICONS = {
  oilwell: '<path d="M-30 27H30 M-19 27 L-3 -27 L13 27 M-13 7 H7 M-8 -10 H2 M-13 7 L2 -10 M7 7 L-8 -10 M-7 -27 H1"/><path d="M24 -2 q-6 9 0 12 q6 -3 0 -12 Z" fill="#fff"/>',
  refinery: '<path d="M-28 26H29 M-24 26 V-4 H-12 V26 M-6 26 V-18 H6 V26 M12 26 V6 H25 V26"/><path d="M0 -24 q5 -5 0 -10 M-18 -10 q5 -5 0 -10"/>',
  truck: '<rect x="-29" y="-13" width="35" height="22" rx="10"/><path d="M6 9 V-5 H17 L27 5 V12 H-29 V9"/><circle cx="-17" cy="16" r="5.5" fill="currentColor"/><circle cx="16" cy="16" r="5.5" fill="currentColor"/>',
  receipt: '<path d="M-17 -27 H17 V25 L11.3 20 L5.7 25 L0 20 L-5.7 25 L-11.3 20 L-17 25 Z"/><path d="M-9 -15 H9 M-9 -5 H9 M-9 5 H3"/>'
};
const iconSVG = (s, x, y, r = 44) => `<g transform="translate(${x} ${y})"><circle r="${r}" fill="${s.color}"/>` +
  `<g transform="scale(${(r / 44).toFixed(3)})" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" style="color:${s.color}">${ICONS[s.icon] || ''}</g></g>`;

function el(tag, attrs, parent, html) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (html !== undefined) e.innerHTML = html;
  (parent || G.sheet).appendChild(e); return e;
}
function text(x, y, s, font, fill, anchor = 'start', parent) {
  const [w, size] = font.split(' ');
  return el('text', { x, y, 'font-family': 'Inter', 'font-weight': w, 'font-size': size, fill, 'text-anchor': anchor }, parent, esc(s));
}
function fit(t, max) { const w = t.getComputedTextLength(); if (w > max) t.setAttribute('font-size', (parseFloat(t.getAttribute('font-size')) * max / w).toFixed(1)); }
function mark(target, pad = 8) {   // a highlighter stroke under an element, revealed left to right by setting the dash offset
  const b = target.getBBox(), y = b.y + b.height * 0.56, h = b.height * 0.78;
  const p = el('path', { d: `M${b.x - pad} ${y} L${b.x + b.width + pad} ${y}`, fill: 'none', stroke: HL, 'stroke-opacity': '.85', 'stroke-width': h }, $('#hl'));
  const len = b.width + 2 * pad; p.style.strokeDasharray = `${len + 1} ${len + 1}`; p.style.strokeDashoffset = len + 1; p._len = len; return p;
}
const reveal = (p, f) => { p.style.strokeDashoffset = (p._len + 1) * (1 - f); };

async function init() {
  T = await (await fetch('timeline.json')).json();
  capC = $('#cap .c'); G.sheet = $('#sheet');
  await Promise.all(['500 22px Inter', '600 32px Inter', '700 36px Inter', '800 40px Inter', '900 84px Inter', '900 98px Inter'].map(f => document.fonts.load(f)));
  await document.fonts.ready;
  const S = T.sheet, scale = BW / S.total;
  el('image', { href: 'edlintics-logo.png', x: 480 - 120, y: 40, width: 240, height: 240 * 170 / 654 });
  G.title = S.title.map((l, i) => { const t = text(480, 205 + i * 96, l, '900 84px', INK, 'middle'); fit(t, 860); return t; });
  G.label = text(480, 362, S.label, '600 32px', MUTED, 'middle');
  G.totalLab = text(BX, 478, S.total_label, '700 36px', '#334155');
  G.total = text(BX + BW, 486, money(S.total), '900 72px', INK, 'end');
  G.totalChip = el('g', { opacity: 0 });
  // the bar: an empty track, then one rect per slice (clipped to the rounded track), white seams, amounts inside
  $('#barclipr').setAttribute('x', BX); $('#barclipr').setAttribute('y', BY); $('#barclipr').setAttribute('width', BW); $('#barclipr').setAttribute('height', BH);
  el('rect', { x: BX, y: BY, width: BW, height: BH, rx: 18, fill: '#F1F5F9', stroke: '#CBD5E1', 'stroke-width': 2 });
  G.ghost = el('rect', { x: BX, y: BY, width: BW, height: BH, rx: 18, fill: 'none', stroke: '#94A3B8', 'stroke-width': 3, 'stroke-dasharray': '10 8', opacity: 0 });
  G.glow = el('rect', { x: BX, y: BY - 6, width: 0, height: BH + 12, rx: 20, fill: 'none', stroke: '#FFD45C', 'stroke-width': 14, opacity: 0 });
  const bars = el('g', { 'clip-path': 'url(#barclip)' });
  G.half = el('g', { opacity: 0 }, null,
    `<line x1="${BX + BW / 2}" y1="${BY - 16}" x2="${BX + BW / 2}" y2="${BY + BH + 16}" stroke="${INK}" stroke-width="4" stroke-dasharray="12 9"/>` +
    `<text x="${BX + BW / 2}" y="${BY + BH + 62}" font-family="Inter" font-weight="800" font-size="34" fill="${INK}" text-anchor="middle">Half</text>`);
  let cum = 0;
  G.slices = S.slices.map((s, i) => {
    const o = { ...s, i, x: BX + cum * scale, w: s.amount * scale }; cum += s.amount;
    o.rect = el('rect', { x: o.x, y: BY, width: 0, height: BH, fill: s.color, stroke: '#fff', 'stroke-width': 4 }, bars);
    o.amt = text(o.x + o.w / 2, BY + BH / 2 + 13, money(s.amount), `800 ${o.w < 150 ? 29 : 38}px`, '#fff', 'middle'); o.amt.style.opacity = 0;
    // legend row
    const y = ROW0 + i * ROWH;
    o.row = el('g', { opacity: 0 });
    el('g', {}, o.row, iconSVG(s, ICX, y));
    o.name = text(ICX + 66, y + 14, s.name, '800 40px', INK, 'start', o.row); fit(o.name, 540);
    o.ramt = text(BX + BW, y + 16, money(s.amount), '900 46px', INK, 'end', o.row);
    return o;
  });
  // turn: a bracket under everything after the main slice, with what it adds up to
  const F = G.slices.find(s => s.id === T.actions.find(a => a.kind === 'focus')?.arg) || G.slices[0];
  const rest = S.total - F.amount, bx0 = F.x + F.w + 6, bx1 = BX + BW;
  G.bracket = el('g', { opacity: 0 }, null,
    `<path d="M${bx0} ${BY + BH + 14} v14 H${bx1} v-14 M${(bx0 + bx1) / 2} ${BY + BH + 28} v12" fill="none" stroke="${INK}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>` +
    `<text x="${(bx0 + bx1) / 2}" y="${BY + BH + 80}" font-family="Inter" font-weight="800" font-size="32" fill="${INK}" text-anchor="middle">${money(rest)} added after the oil</text>`);
  G.focus = F;
  // value chain arrow, raw material on the left to the customer on the right
  const ay = BY + BH + 40;
  G.chain = el('path', { d: `M${BX} ${ay} H${BX + BW - 4} M${BX + BW - 26} ${ay - 16} L${BX + BW - 4} ${ay} L${BX + BW - 26} ${ay + 16}`, fill: 'none', stroke: INK, 'stroke-width': 5, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
  const cl = G.chain.getTotalLength(); G.chain.style.strokeDasharray = `${cl + 1} ${cl + 1}`; G.chain.style.strokeDashoffset = cl + 1; G.chainLen = cl;
  G.chainEnds = el('g', { opacity: 0 });
  text(BX, ay + 50, S.chain.from, '800 32px', '#334155', 'start', G.chainEnds); text(BX + BW, ay + 50, S.chain.to, '800 32px', '#334155', 'end', G.chainEnds);
  // takeaway chips
  const sh = S.shrink, SS = G.slices.find(s => s.id === sh.slice);
  G.shrinkSlice = SS;
  const chip = (x, y, s, parent) => { const g = el('g', {}, parent); const t = text(x, y, s, '800 34px', '#B42318', 'end', g); const b = t.getBBox();
    el('rect', { x: b.x - 14, y: b.y - 6, width: b.width + 28, height: b.height + 12, rx: (b.height + 12) / 2, fill: '#FEE4E2' }, g).parentNode.insertBefore(g.lastChild, t); return g; };
  G.sliceChip = el('g', { opacity: 0 }); chip(BX + BW - 150, ROW0 + SS.i * ROWH + 13, sh.pct_slice, G.sliceChip);
  chip(BX + BW - 238, 478, sh.pct_total, G.totalChip);
  G.small = text(480, 1262, S.small_print, '500 22px', MUTED, 'middle'); fit(G.small, 860);
  // highlighter strokes (they stay on, like ink)
  G.hlTotal = mark(G.total, 10); G.hlFocus = mark(F.name, 10); G.hlFocusAmt = mark(F.ramt, 8);
  // end card: the value chain as a row of the slice icons with chevrons
  const n = S.slices.length, ex0 = 180, ex1 = 900, ey = 1060;
  let ec = '';
  S.slices.forEach((s, i) => { const x = ex0 + (ex1 - ex0) * i / (n - 1); ec += iconSVG(s, x, ey, 58);
    if (i < n - 1) { const cx = x + (ex1 - ex0) / (n - 1) / 2; ec += `<path d="M${cx - 9} ${ey - 16} L${cx + 7} ${ey} L${cx - 9} ${ey + 16}" fill="none" stroke="${MUTED}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>`; } });
  ec += `<text x="${ex0 - 58}" y="${ey + 112}" font-family="Inter" font-weight="800" font-size="34" fill="#334155">${esc(S.chain.from)}</text>`;
  ec += `<text x="${ex1 + 58}" y="${ey + 112}" font-family="Inter" font-weight="800" font-size="34" fill="#334155" text-anchor="end">${esc(S.chain.to)}</text>`;
  $('#endchain').innerHTML = ec;
  $('#end .term').textContent = T.endcard.term; $('#end .kp span').textContent = T.endcard.keypoint; $('#end .fw').textContent = T.endcard.follow;
  A = T.actions;
  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
  return T.dur;
}

const act = (kind, arg) => A.filter(a => a.kind === kind && (arg === undefined || a.arg === arg));
const prog = (a, t, e = true) => a ? (e ? ease(ramp(t, a.t0, a.t1)) : ramp(t, a.t0, a.t1)) : 0;

function render(t) {
  const endIn = ease(ramp(t, T.end_t, T.end_t + 0.4)), loop = t > T.dur - 0.45;
  const tv = loop ? 0 : t;   // final 0.45 s: the end card fades out onto the clean opening frame (seamless loop)
  const S = T.sheet, scale = BW / S.total;
  // total pulse + highlight
  const pu = act('pulse')[0]; reveal(G.hlTotal, prog(pu, tv));
  const bump = pu ? Math.sin(Math.PI * ramp(tv, pu.t0, pu.t0 + 0.4)) : 0;
  G.total.setAttribute('transform', `translate(${BX + BW} 470) scale(${1 + 0.08 * bump}) translate(${-(BX + BW)} -470)`);
  // takeaway: the main slice shrinks, everything after it slides left, the total counts down
  const sk = act('shrink')[0], fs = prog(sk, tv), d = S.shrink.by * fs;
  // the half marker shows from the hook until the main slice has filled
  const ha = act('half')[0], f0 = act('fill', G.slices[0].id)[0];
  G.half.setAttribute('opacity', ha ? ease(ramp(tv, ha.t0, ha.t0 + 0.3)) * (1 - ease(ramp(tv, f0 ? f0.t1 + 0.2 : 1e9, f0 ? f0.t1 + 0.6 : 1e9))) : 0);
  // focus (turn): the main slice glows, the rest dims; unfocus restores
  const fo = act('focus')[0], uf = act('unfocus')[0];
  const dim = fo ? ease(ramp(tv, fo.t0, fo.t0 + 0.35)) * (1 - (uf ? ease(ramp(tv, uf.t0, uf.t0 + 0.35)) : 0)) : 0;
  let x = BX;
  for (const s of G.slices) {
    const amount = s.amount - (s === G.shrinkSlice ? d : 0), w = amount * scale;
    const fl = act('fill', s.id)[0], f = prog(fl, tv);
    s.rect.setAttribute('x', x.toFixed(1)); s.rect.setAttribute('width', (w * f).toFixed(1));
    s.amt.setAttribute('x', (x + w / 2).toFixed(1)); s.amt.textContent = money(amount);
    s.amt.style.opacity = fl ? ramp(tv, fl.t1 - 0.15, fl.t1 + 0.1) : 0;
    const other = s !== G.focus ? 1 - 0.68 * dim : 1;
    s.rect.style.opacity = other; s.amt.style.opacity *= other;
    const rw = act('row', s.id)[0], rf = rw ? ease(ramp(tv, rw.t0, rw.t0 + 0.35)) : 0;
    s.row.setAttribute('opacity', (rf * other).toFixed(3)); s.row.setAttribute('transform', `translate(${(-24 * (1 - rf)).toFixed(1)} 0)`);
    s.ramt.textContent = money(amount);
    if (s === G.focus) { G.glow.setAttribute('x', x - 6); G.glow.setAttribute('width', w * f + 12); }
    x += w;
  }
  G.glow.setAttribute('opacity', (dim * (0.85 + 0.15 * Math.sin(tv * 6))).toFixed(3));
  reveal(G.hlFocus, fo ? ease(ramp(tv, fo.t0 + 0.15, fo.t0 + 0.75)) : 0); reveal(G.hlFocusAmt, fo ? ease(ramp(tv, fo.t0 + 0.6, fo.t0 + 1.0)) : 0);
  const br = act('bracket')[0];
  G.bracket.setAttribute('opacity', br ? ease(ramp(tv, br.t0, br.t0 + 0.3)) * (1 - (uf ? ease(ramp(tv, uf.t0, uf.t0 + 0.3)) : 0)) : 0);
  const ch = act('chain')[0], ce = act('chainends')[0];
  G.chain.style.strokeDashoffset = (G.chainLen + 1) * (1 - (ch ? ease(ramp(tv, ch.t0, ch.t0 + 1.0)) : 0));
  G.chainEnds.setAttribute('opacity', ce ? ease(ramp(tv, ce.t0, ce.t0 + 0.3)) : 0);
  G.total.textContent = money(S.total - d);
  G.ghost.setAttribute('opacity', (ease(ramp(fs, 0, 0.3))).toFixed(3));
  const chipIn = sk ? ease(ramp(tv, sk.t1 - 0.2, sk.t1 + 0.2)) : 0;
  G.sliceChip.setAttribute('opacity', sk ? ease(ramp(tv, sk.t0, sk.t0 + 0.3)) : 0); G.totalChip.setAttribute('opacity', chipIn);
  // captions: current chunk
  let cur = null; for (const c of T.chunks) if (tv >= c.t && tv < c.t_end) cur = c;
  if (tv >= T.end_t || !cur) { capC.style.opacity = 0; }
  else {
    const html = cur.key ? esc(cur.text).replace(esc(cur.key), `<span class="k">${esc(cur.key)}</span>`) : esc(cur.text);
    if (capC.dataset.v !== cur.text) { capC.innerHTML = html; capC.dataset.v = cur.text; capC.style.fontSize = ''; const w = capC.scrollWidth; capC.style.fontSize = w > 1000 ? (98 * 1000 / w) + 'px' : ''; }
    const ct = tv - cur.t; capC.style.opacity = clamp(ct / 0.05); capC.style.transform = `scale(${0.86 + 0.14 * back(clamp(ct / 0.16))})`;
  }
  $('#end').style.opacity = endIn * (loop ? 1 - ease(ramp(t, T.dur - 0.45, T.dur)) : 1);
  $('#end .kp span').style.setProperty('--w', (ease(ramp(t, T.end_kp_t, T.end_kp_t + 0.6)) * 100) + '%');
  document.body.offsetHeight;
}

// cover: frame at time t with a title panel over the sheet head, inside the 3:4 grid crop (y 240-1680)
function cover(kicker, title) {
  capC.style.opacity = 0; $('#end').style.opacity = 0;
  G.title.forEach(t => t.style.opacity = 0); G.label.style.opacity = 0; G.sheet.querySelector('image').style.opacity = 0;
  const d = document.createElement('div');
  d.style.cssText = 'position:absolute;left:60px;right:60px;top:150px;padding:30px 40px 36px;background:#fff;border-radius:28px;box-shadow:0 14px 40px rgba(40,20,5,.35);text-align:center';
  d.innerHTML = `<div style="font:800 40px/1.1 Inter,sans-serif;color:#467DE3;letter-spacing:.06em;text-transform:uppercase;margin-bottom:16px">${esc(kicker)}</div>` +
    `<div style="font:900 96px/1.04 Inter,sans-serif;color:#0F172A;letter-spacing:-0.02em;text-wrap:balance">${esc(title).replace(/\*(.+?)\*/g, '<span style="background-image:linear-gradient(transparent 55%,#FFD45C 55%,#FFD45C 93%,transparent 93%);padding:0 8px">$1</span>')}</div>`;
  document.body.appendChild(d);
  const lim = G.totalLab.getBoundingClientRect().top - 14, ti = d.lastChild; let fs = 96;
  while (d.getBoundingClientRect().bottom > lim && fs > 60) { fs -= 2; ti.style.fontSize = fs + 'px'; }
  if (d.getBoundingClientRect().bottom > lim) console.error('cover panel covers the price row: use a shorter title');
}
window.init = init; window.render = render; window.cover = cover;
</script></body></html>
