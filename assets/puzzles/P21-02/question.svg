<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="1080" height="1350" fill="#ffffff"/>
<text id="kicker" x="540.0" y="167" font-family="Source Serif 4, serif (template font ref YACgEfdj394 — unverified name)" font-size="56" font-weight="400" font-style="normal" fill="#0d1523" text-anchor="middle"><tspan x="540.0" dy="0">OPERATIONS QUIZ</tspan></text>
<text id="prompt" x="540.0" y="249" font-family="Source Serif 4, serif (template font ref YACgEfdj394 — unverified name)" font-size="40" font-weight="400" font-style="normal" fill="#0d1523" text-anchor="middle"><tspan x="540.0" dy="0">Both orders need 10 minutes of work. Which should</tspan><tspan x="540.0" dy="48.0">start first to finish BOTH sooner?</tspan></text>
<rect id="legend_print" x="120" y="400" width="40" height="40" rx="6" fill="#2960c7" stroke="none" stroke-width="0"/>
<text id="legend_print_t" x="172" y="428" font-family="Inter, sans-serif (Canva default ref YACgEZ1cb1Q — unverified name)" font-size="30" font-weight="400" font-style="normal" fill="#0d1523" text-anchor="start"><tspan x="172" dy="0">Print step (1 printer)</tspan></text>
<rect id="legend_pack" x="580" y="400" width="40" height="40" rx="6" fill="#c9d8f5" stroke="none" stroke-width="0"/>
<text id="legend_pack_t" x="632" y="428" font-family="Inter, sans-serif (Canva default ref YACgEZ1cb1Q — unverified name)" font-size="30" font-weight="400" font-style="normal" fill="#0d1523" text-anchor="start"><tspan x="632" dy="0">Pack step (1 packer)</tspan></text>
<text id="order_a" x="90" y="506" font-family="Inter, sans-serif (Canva default ref YACgEZ1cb1Q — unverified name)" font-size="36" font-weight="700" font-style="normal" fill="#0d1523" text-anchor="start"><tspan x="90" dy="0">Order A</tspan></text>
