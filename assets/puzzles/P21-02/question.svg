<text id="a_pack_t" x="585.0" y="580" font-family="Inter, sans-serif (Canva default ref YACgEZ1cb1Q — unverified name)" font-size="34" font-weight="700" font-style="normal" fill="#0d1523" text-anchor="middle"><tspan x="585.0" dy="0">9 min</tspan></text>
<text id="order_b" x="90" y="686" font-family="Inter, sans-serif (Canva default ref YACgEZ1cb1Q — unverified name)" font-size="36" font-weight="700" font-style="normal" fill="#0d1523" text-anchor="start"><tspan x="90" dy="0">Order B</tspan></text>
<rect id="b_print" x="90" y="705" width="810" height="90" rx="0" fill="#2960c7" stroke="#ffffff" stroke-width="4"/>
