<text id="b_pack_t" x="945.0" y="758" font-family="Inter, sans-serif (Canva default ref YACgEZ1cb1Q — unverified name)" font-size="26" font-weight="700" font-style="normal" fill="#0d1523" text-anchor="middle"><tspan x="945.0" dy="0">1 min</tspan></text>
<text id="choice" x="540.0" y="889" font-family="Inter, sans-serif (Canva default ref YACgEZ1cb1Q — unverified name)" font-size="54" font-weight="700" font-style="normal" fill="#2960c7" text-anchor="middle"><tspan x="540.0" dy="0">Start A or start B?</tspan></text>
<rect id="assumption_panel" x="90" y="935" width="900" height="290" rx="24" fill="#eef3fc" stroke="none" stroke-width="0"/>
<text id="assumptions" x="130" y="988" font-family="Inter, sans-serif (Canva default ref YACgEZ1cb1Q — unverified name)" font-size="30" font-weight="400" font-style="normal" fill="#0d1523" text-anchor="start"><tspan x="130" dy="0">Both orders are ready now.</tspan><tspan x="130" dy="40.5">Each order must finish printing before packing.</tspan><tspan x="130" dy="40.5">Each station handles one whole order at a time.</tspan><tspan x="130" dy="40.5">The printer and packer can work at the same time.</tspan><tspan x="130" dy="40.5">No setup or transfer time.</tspan><tspan x="130" dy="40.5">Goal: both orders packed as early as possible.</tspan></text>
