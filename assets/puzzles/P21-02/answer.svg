<text id="takeaway" x="130" y="951" font-family="Inter, sans-serif (Canva default ref YACgEZ1cb1Q — unverified name)" font-size="36" font-weight="700" font-style="normal" fill="#0d1523" text-anchor="start"><tspan x="130" dy="0">Equal total work does not mean equal</tspan><tspan x="130" dy="46.800000000000004">completion time.</tspan></text>
<text id="explanation" x="130" y="1065" font-family="Inter, sans-serif (Canva default ref YACgEZ1cb1Q — unverified name)" font-size="30" font-weight="400" font-style="normal" fill="#0d1523" text-anchor="start"><tspan x="130" dy="0">Sequencing changes overlap. Starting A lets the packer</tspan><tspan x="130" dy="40.5">begin after 1 minute. Starting B leaves the packer idle for 9</tspan><tspan x="130" dy="40.5">minutes, so A's 9-minute pack comes last.</tspan></text>
