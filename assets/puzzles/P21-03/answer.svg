<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="1080" height="1350" fill="#ffffff"/>
<text id="title" x="540.0" y="114" font-family="Inter, sans-serif (Canva default ref YACgEZ1cb1Q — unverified name)" font-size="36" font-weight="700" font-style="normal" fill="#0d1523" text-anchor="middle"><tspan x="540.0" dy="0">Videos given up for ONE extra logo</tspan></text>
<text id="ava_calc" x="90" y="190" font-family="Inter, sans-serif (Canva default ref YACgEZ1cb1Q — unverified name)" font-size="32" font-weight="400" font-style="normal" fill="#0d1523" text-anchor="start"><tspan x="90" dy="0">Ava: 3 videos ÷ 6 logos = ½ video per logo</tspan></text>
<rect id="ava_bar" x="90" y="212" width="900" height="80" rx="12" fill="#ffffff" stroke="#0d1523" stroke-width="3"/>
<rect id="ava_fill" x="93" y="215" width="447" height="74" rx="10" fill="#9fb6e3" stroke="none" stroke-width="0"/>
<text id="ava_fill_t" x="316.5" y="263" font-family="Inter, sans-serif (Canva default ref YACgEZ1cb1Q — unverified name)" font-size="38" font-weight="700" font-style="normal" fill="#0d1523" text-anchor="middle"><tspan x="316.5" dy="0">½</tspan></text>
<text id="ben_calc" x="90" y="360" font-family="Inter, sans-serif (Canva default ref YACgEZ1cb1Q — unverified name)" font-size="32" font-weight="700" font-style="normal" fill="#2960c7" text-anchor="start"><tspan x="90" dy="0">Ben: 1 video ÷ 4 logos = ¼ video per logo</tspan></text>
<rect id="ben_bar" x="90" y="382" width="900" height="80" rx="12" fill="#ffffff" stroke="#0d1523" stroke-width="3"/>
<rect id="ben_fill" x="93" y="385" width="224" height="74" rx="10" fill="#2960c7" stroke="none" stroke-width="0"/>
<text id="ben_fill_t" x="205.0" y="433" font-family="Inter, sans-serif (Canva default ref YACgEZ1cb1Q — unverified name)" font-size="38" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle"><tspan x="205.0" dy="0">¼</tspan></text>
<text id="scale" x="990" y="496" font-family="Inter, sans-serif (Canva default ref YACgEZ1cb1Q — unverified name)" font-size="24" font-weight="400" font-style="normal" fill="#5b6475" text-anchor="end"><tspan x="990" dy="0">Full bar = 1 whole video</tspan></text>
<rect id="takeaway_panel" x="90" y="575" width="900" height="345" rx="24" fill="#eef3fc" stroke="none" stroke-width="0"/>
<text id="takeaway" x="130" y="641" font-family="Inter, sans-serif (Canva default ref YACgEZ1cb1Q — unverified name)" font-size="36" font-weight="700" font-style="normal" fill="#0d1523" text-anchor="start"><tspan x="130" dy="0">Lower opportunity cost, not outright speed,</tspan><tspan x="130" dy="46.800000000000004">decides comparative advantage.</tspan></text>
<text id="explanation" x="130" y="753" font-family="Inter, sans-serif (Canva default ref YACgEZ1cb1Q — unverified name)" font-size="30" font-weight="400" font-style="normal" fill="#0d1523" text-anchor="start"><tspan x="130" dy="0">Ava is faster at both jobs: that is absolute advantage. Ben is</tspan><tspan x="130" dy="40.5">slower at both, yet each logo costs him fewer videos. Ava's</tspan><tspan x="130" dy="40.5">time is better spent on videos: each video costs her 2 logos,</tspan><tspan x="130" dy="40.5">but costs Ben 4.</tspan></text>
<text id="kicker" x="540.0" y="1065" font-family="Source Serif 4, serif (template font ref YACgEfdj394 — unverified name)" font-size="56" font-weight="700" font-style="normal" fill="#2960c7" text-anchor="middle"><tspan x="540.0" dy="0">Answer</tspan></text>
<text id="headline" x="540.0" y="1142" font-family="Source Serif 4, serif (template font ref YACgEfdj394 — unverified name)" font-size="40" font-weight="400" font-style="normal" fill="#0d1523" text-anchor="middle"><tspan x="540.0" dy="0">Ben. Each extra logo costs Ben ¼ of a video, but costs</tspan><tspan x="540.0" dy="48.0">Ava ½ of a video.</tspan></text>
<image id="logo" x="434.6" y="1269" width="221.1" height="61.9" href="../../brand/edlintics-logo.svg"/>
