<svg xmlns="http://www.w3.org/2000/svg" width="980" height="850" viewBox="0 0 980 850"><rect width="980" height="850" fill="white"/><text x="490" y="80" text-anchor="middle" font-family="Arial,sans-serif" font-size="48" font-weight="600" fill="#168768">A  ·  You finish with €96</text><rect x="45" y="160" width="890" height="370" rx="24" fill="#EAF1FD"/><text x="490" y="250" text-anchor="middle" font-family="Arial,sans-serif" font-size="51" font-weight="600" fill="#467DE3">€100 × 1.20 = €120</text><text x="490" y="365" text-anchor="middle" font-family="Arial,sans-serif" font-size="51" font-weight="600" fill="#467DE3">€120 × 0.80 = €96</text><text x="490" y="465" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="600" fill="#0D1523">The loss is €24. The gain was €20.</text><text x="490" y="635" text-anchor="middle" font-family="Arial,sans-serif" font-size="33" font-weight="600" fill="#0D1523">Equal percentages use different bases.</text><text x="490" y="775" text-anchor="middle" font-family="Arial,sans-serif" font-size="37" font-weight="600" fill="#168768">+20% then −20% is a 4% loss.</text></svg>