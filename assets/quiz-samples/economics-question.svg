<svg xmlns="http://www.w3.org/2000/svg" width="980" height="850" viewBox="0 0 980 850"><rect width="980" height="850" fill="white"/><text x="490" y="60" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="600" fill="#0D1523">What each maker can produce in one day</text><text x="490" y="110" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#64748B">Choose one product per day.</text><rect x="40" y="170" width="420" height="380" rx="24" fill="#EAF1FD"/><text x="250" y="235" text-anchor="middle" font-family="Arial,sans-serif" font-size="33" font-weight="600" fill="#467DE3">MAYA</text><text x="250" y="330" text-anchor="middle" font-family="Arial,sans-serif" font-size="48" font-weight="600" fill="#0D1523">4 tables</text><text x="250" y="390" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="600" fill="#64748B">OR</text><text x="250" y="475" text-anchor="middle" font-family="Arial,sans-serif" font-size="48" font-weight="600" fill="#0D1523">8 chairs</text><rect x="520" y="170" width="420" height="380" rx="24" fill="#EAF1FD"/><text x="730" y="235" text-anchor="middle" font-family="Arial,sans-serif" font-size="33" font-weight="600" fill="#467DE3">LEO</text><text x="730" y="330" text-anchor="middle" font-family="Arial,sans-serif" font-size="48" font-weight="600" fill="#0D1523">3 tables</text><text x="730" y="390" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="600" fill="#64748B">OR</text><text x="730" y="475" text-anchor="middle" font-family="Arial,sans-serif" font-size="48" font-weight="600" fill="#0D1523">3 chairs</text><text x="490" y="615" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="600" fill="#0D1523">Who gives up fewer chairs per table?</text><rect x="30" y="670" width="290" height="100" rx="24" fill="#F4F6F9"/><text x="175" y="733" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="600" fill="#0D1523">A  Maya</text><rect x="340" y="670" width="290" height="100" rx="24" fill="#F4F6F9"/><text x="485" y="733" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="600" fill="#0D1523">B  Leo</text><rect x="650" y="670" width="290" height="100" rx="24" fill="#F4F6F9"/><text x="795" y="733" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="600" fill="#0D1523">C  Same cost</text><text x="490" y="823" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#64748B">Choose your answer. Swipe for the reasoning.</text></svg>