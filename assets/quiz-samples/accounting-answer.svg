<svg xmlns="http://www.w3.org/2000/svg" width="980" height="850" viewBox="0 0 980 850"><rect width="980" height="850" fill="white"/><text x="490" y="95" text-anchor="middle" font-family="Arial,sans-serif" font-size="48" font-weight="600" fill="#168768">B  ·  Profit does not change</text><rect x="40" y="185" width="900" height="270" rx="24" fill="#EAF1FD"/><text x="490" y="260" text-anchor="middle" font-family="Arial,sans-serif" font-size="42" font-weight="600" fill="#0D1523">Assets = Liabilities + Equity</text><text x="490" y="365" text-anchor="middle" font-family="Arial,sans-serif" font-size="48" font-weight="600" fill="#467DE3">+ €1,000 = + €1,000 + €0</text><text x="490" y="550" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="600" fill="#0D1523">Borrowing creates an obligation to repay.</text><text x="490" y="605" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="600" fill="#0D1523">It is not income earned by the business.</text><text x="490" y="770" text-anchor="middle" font-family="Arial,sans-serif" font-size="37" font-weight="600" fill="#168768">Cash received ≠ revenue earned</text></svg>