ange</text><rect x="650" y="670" width="290" height="100" rx="24" fill="#F4F6F9"/><text x="795" y="733" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="600" fill="#0D1523">C  Down €1,000</text><text x="490" y="823" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#64748B">Choose your answer. Swipe for the reasoning.</text></svg>