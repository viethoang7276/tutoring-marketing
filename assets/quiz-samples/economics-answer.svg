<svg xmlns="http://www.w3.org/2000/svg" width="980" height="850" viewBox="0 0 980 850"><rect width="980" height="850" fill="white"/><text x="490" y="80" text-anchor="middle" font-family="Arial,sans-serif" font-size="51" font-weight="600" fill="#168768">B  ·  Leo</text><text x="490" y="140" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="600" fill="#0D1523">Compare the chairs given up for one table.</text><rect x="40" y="220" width="420" height="330" rx="24" fill="#EAF1FD"/><text x="250" y="280" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="600" fill="#64748B">MAYA</text><text x="250" y="380" text-anchor="middle" font-family="Arial,sans-serif" font-size="61" font-weight="600" fill="#467DE3">8 ÷ 4</text><text x="250" y="470" text-anchor="middle" font-family="Arial,sans-serif" font-size="44" font-weight="600" fill="#0D1523">2 chairs</text><rect x="520" y="220" width="420" height="330" rx="24" fill="#EAF1FD"/><text x="730" y="280" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="600" fill="#64748B">LEO</text><text x="730" y="380" text-anchor="middle" font-family="Arial,sans-serif" font-size="61" font-weight="600" fill="#467DE3">3 ÷ 3</text><text x="730" y="470" text-anchor="middle" font-family="Arial,sans-serif" font-size="44" font-weight="600" fill="#0D1523">1 chair</text><text x="490" y="660" text-anchor="middle" font-family="Arial,sans-serif" font-size="35" font-weight="600" fill="#0D1523">Leo has the lower opportunity cost.</text><text x="490" y="780" text-anchor="middle" font-family="Arial,sans-serif" font-size="37" font-weight="600" fill="#168768">That is comparative advantage.</text></svg>