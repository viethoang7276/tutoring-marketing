<svg xmlns="http://www.w3.org/2000/svg" width="980" height="850" viewBox="0 0 980 850"><rect width="980" height="850" fill="white"/><text x="490" y="75" text-anchor="middle" font-family="Arial,sans-serif" font-size="45" font-weight="600" fill="#168768">B  ·  The combined mean is 75</text><rect x="40" y="170" width="900" height="370" rx="24" fill="#EAF1FD"/><text x="490" y="245" text-anchor="middle" font-family="Arial,sans-serif" font-size="52" font-weight="600" fill="#467DE3">10 × 60 + 30 × 80</text><path d="M170 275L810 275" stroke="#0D1523" stroke-width="5" fill="none"/><text x="490" y="340" text-anchor="middle" font-family="Arial,sans-serif" font-size="52" font-weight="600" fill="#467DE3">10 + 30</text><text x="490" y="450" text-anchor="middle" font-family="Arial,sans-serif" font-size="47" font-weight="600" fill="#0D1523">3,000 ÷ 40 = 75</text><text x="490" y="635" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="600" fill="#0D1523">Group B has three times as many students.</text><text x="490" y="700" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="600" fill="#0D1523">Its mean needs three times the weight.</text><text x="490" y="800" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="600" fill="#168768">Do not average averages without weights.</text></svg>